blueprint:
  name: Advanced Motion Activated Light Group with Time-Based Brightness
  description: >
    Turns on groups of non-dimmable lights when motion detected, then off
    after motion clears. Three switch groups (Max, Medium, Low brightness)
    are activated based on time of day.
  domain: automation
  input:
    max_brightness_group:
      name: Max Brightness Group
      description: Select all switch entities for maximum brightness lights. Leave empty if not used.
      selector:
        entity:
          domain: switch
          multiple: true

    medium_brightness_group:
      name: Medium Brightness Group
      description: Select all switch entities for medium brightness lights. Leave empty if not used.
      selector:
        entity:
          domain: switch
          multiple: true

    low_brightness_group:
      name: Low Brightness Group
      description: Select all switch entities for low brightness lights. Leave empty if not used.
      selector:
        entity:
          domain: switch
          multiple: true

    motion_sensor:
      name: Motion Sensor
      description: Select the motion sensor to monitor.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy

    wait_period:
      name: Wait Period
      description: >
        Time in seconds to wait after motion stops before turning off the
        light.
      default: 360
      selector:
        number:
          min: 0
          max: 3600
          step: 15
          unit_of_measurement: seconds

    active_time_end:
      name: Enable
      description: >
        Input boolean helper to enable/disable the automation. When off, the
        automation will not run regardless of motion detection.
      selector:
        entity:
          domain: input_boolean

    luminance_sensor:
      name: Luminance Sensor
      description: >
        Select a luminance/illuminance sensor. When the reading is above
        the luminance threshold, the light will NOT turn on. Leave blank
        to always turn on when motion is detected.
      selector:
        entity:
          domain: sensor
          multiple: true

    luminance_threshold:
      name: Luminance Threshold
      description: >
        If the luminance sensor reading is above this value (lux), the light
        will not turn on. Only used when a luminance sensor is selected.
      default: 100
      selector:
        number:
          min: 0
          max: 40
          step: 10
          unit_of_measurement: "lux"

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"


variables:
  max_brightness_group: !input max_brightness_group
  medium_brightness_group: !input medium_brightness_group
  low_brightness_group: !input low_brightness_group
  wait_period: !input wait_period

  max_on: >
    {% set h = now().hour %}
    {{ h >= 9 and h < 18 }}

  medium_on: >
    {% set h = now().hour %}
    {{ (h >= 6 and h < 9) or (h >= 18 and h < 22) }}

  low_on: >
    true

  skip_light: >
    {% set max_entities = inputs.max_brightness_group %}
    {% set med_entities = inputs.medium_brightness_group %}
    {% set low_entities = inputs.low_brightness_group %}
    {% set any_on = false %}
    {% for entity in max_entities + med_entities + low_entities %}
      {% if is_state(entity, 'on') %}
        {% set any_on = true %}
      {% endif %}
    {% endfor %}
    {% if any_on %}
      false
    {% elif inputs.luminance_sensor and states(inputs.luminance_sensor) not in ['unknown', 'unavailable', 'none'] %}
      {{ (states(inputs.luminance_sensor) | float > inputs.luminance_threshold) }}
    {% else %}
      false
    {% endif %}

condition:
  - condition: state
    entity_id: !input active_time_end
    state: "on"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'state' }}"
          - condition: template
            value_template: "{{ not skip_light }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ inputs.max_on }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ inputs.max_brightness_group }}"

              - conditions:
                  - condition: template
                    value_template: "{{ inputs.medium_on }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ inputs.medium_brightness_group }}"

              - conditions:
                  - condition: template
                    value_template: "{{ inputs.low_on }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ inputs.low_brightness_group }}"

  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensor
        to: "off"

  - delay: !input wait_period

  - service: switch.turn_off
    target:
      entity_id: >
        {{ [inputs.max_brightness_group, inputs.medium_brightness_group, inputs.low_brightness_group] | flatten | list }}
