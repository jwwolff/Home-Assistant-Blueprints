blueprint:
  name: Advanced Motion Activated Light with Time-Based Dimming
  description: >
    Turns a dimmable light on when motion detected, then off after motion clears.
    Brightness and color temperature vary by time of day.
    Also controls additional non-dimmable lights as a group.
  domain: automation
  input:
    light_entity:
      name: Light(s)
      description: Select the non-dimmable light entities.
      selector:
        entity:
          domain: light
          multiple: true

    motion_sensor:
      name: Motion Sensor
      description: Select the motion sensor to monitor.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy

    wait_period:
      name: Wait Period
      description: >
        Time in seconds to wait after motion stops before turning off the
        light.
      default: 360
      selector:
        number:
          min: 0
          max: 3600
          step: 15
          unit_of_measurement: seconds

    active_time_start:
      name: Active Time Start (optional)
      description: >
        Optional start of time range during which the automation is active.
        Leave blank to always be active.
      selector:
        entity:
          domain: input_datetime

    active_time_end:
      name: Enable
      description: >
        Input boolean helper to enable/disable the automation. When off, the
        automation will not run regardless of motion detection.
      selector:
        entity:
          domain: input_boolean

    morning_brightness:
      name: "Morning Brightness (06-09)"
      description: Brightness percentage during morning hours.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 5
          unit_of_measurement: "%"

    day_brightness:
      name: "Day Brightness (09-18)"
      description: Brightness percentage during daytime hours.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 5
          unit_of_measurement: "%"

    evening_brightness:
      name: "Evening Brightness (18-22)"
      description: Brightness percentage during evening hours.
      default: 60
      selector:
        number:
          min: 1
          max: 100
          step: 5
          unit_of_measurement: "%"

    night_brightness:
      name: "Night Brightness (22-06)"
      description: Brightness percentage during nighttime hours.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 5
          unit_of_measurement: "%"

    morning_color_temp:
      name: "Morning Color Temp (mired)"
      description: "e.g. 350 = 2857 K, warm-white for mornings"
      default: 350
      selector:
        number:
          min: 153
          max: 500
          step: 1

    day_color_temp:
      name: "Day Color Temp (mired)"
      description: "e.g. 300 = 3333 K, neutral-white for daytime"
      default: 300
      selector:
        number:
          min: 153
          max: 500
          step: 1

    evening_color_temp:
      name: "Evening Color Temp (mired)"
      description: "e.g. 370 = 2703 K, warm-white for evenings"
      default: 370
      selector:
        number:
          min: 153
          max: 500
          step: 1

    night_color_temp:
      name: "Night Color Temp (mired)"
      description: "e.g. 400 = 2500 K, very warm for nighttime"
      default: 400
      selector:
        number:
          min: 153
          max: 500
          step: 1

    luminance_sensor:
      name: Luminance Sensor (optional)
      description: >
        Select a luminance/illuminance sensor. If set and the reading is
        above the luminance threshold, the light will NOT turn on. Leave
        blank to always turn on when motion is detected.
      selector:
        entity:
          domain: sensor

    luminance_threshold:
      name: Luminance Threshold
      description: >
        If the luminance sensor reading is above this value (lux), the light
        will not turn on. Only used when a luminance sensor is selected.
      default: 100
      selector:
        number:
          min: 0
          max: 40
          step: 10
          unit_of_measurement: "lux"

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"

  - platform: time
    at: !input active_time_start

variables:
  light_entity: !input light_entity
  wait_period: !input wait_period

  current_brightness: >
    {% set h = now().hour %}
    {% if h >= 6 and h < 9 %}
      {{ inputs.morning_brightness }}
    {% elif h >= 9 and h < 18 %}
      {{ inputs.day_brightness }}
    {% elif h >= 18 and h < 22 %}
      {{ inputs.evening_brightness }}
    {% else %}
      {{ inputs.night_brightness }}
    {% endif %}

  current_color_temp: >
    {% set h = now().hour %}
    {% if h >= 6 and h < 9 %}
      {{ inputs.morning_color_temp }}
    {% elif h >= 9 and h < 18 %}
      {{ inputs.day_color_temp }}
    {% elif h >= 18 and h < 22 %}
      {{ inputs.evening_color_temp }}
    {% else %}
      {{ inputs.night_color_temp }}
    {% endif %}

  brightness_value: >
    {{ (current_brightness | float / 100 * 255) | round | int }}

  skip_light: >
    {% set sensor = inputs.luminance_sensor %}
    {% if sensor and states(sensor) not in ['unknown', 'unavailable', 'none'] %}
      {{ (states(sensor) | float > inputs.luminance_threshold) }}
    {% else %}
      false
    {% endif %}

condition:
  - condition: state
    entity_id: !input active_time_end
    state: "on"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'time' }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input active_time_end

      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'state' }}"
          - condition: template
            value_template: "{{ not skip_light }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness: "{{ brightness_value }}"
              color_temp: "{{ current_color_temp }}"

  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensor
        to: "off"

  - delay: !input wait_period

  - service: light.turn_off
    target:
      entity_id: "{{ light_entity }}"
